# Localmain installer build — the personal fork's automatic three-platform
# package run. Unlike Desktop release, this never creates a release and never
# signs/notarizes; it produces unsigned workflow artifacts for every push to
# `localmain` (or a manual dispatch).
name: Localmain installers

on:
  push:
    branches: [localmain]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localmain-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Localmain gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  package:
    name: Package (${{ matrix.platform }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac-arm64
            builder_args: --mac --arm64
          - os: windows-2025
            platform: windows-x64
            builder_args: --win --x64
          - os: ubuntu-24.04
            platform: linux-x64
            builder_args: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Select Xcode 26+ for actool (mac icon compile)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Unsigned macOS package
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.builder_args }} --publish never -c.mac.notarize=false
      - name: Windows/Linux package
        if: runner.os != 'macOS'
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
      - name: Initialize packaged providers offline (host and packaged Electron Node)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/LearnHarness.app/Contents"
              payload="$app/Resources/server/standalone"
              runtime="$app/MacOS/LearnHarness"
              ;;
            Windows)
              payload="dist/win-unpacked/resources/server/standalone"
              runtime="dist/win-unpacked/LearnHarness.exe"
              ;;
            Linux)
              payload="dist/linux-unpacked/resources/server/standalone"
              runtime="dist/linux-unpacked/learnharness"
              ;;
          esac
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
      - name: Exercise packaged demo runtime (own Electron, no system Chrome)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/LearnHarness.app/Contents"
              node scripts/smoke-demo-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/LearnHarness" --browser
              ;;
            Windows)
              node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime dist/win-unpacked/LearnHarness.exe --browser
              ;;
            Linux)
              xvfb-run -a node scripts/smoke-demo-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone --runtime dist/linux-unpacked/learnharness --browser
              ;;
          esac
      - name: Save unsigned installers
        uses: actions/upload-artifact@v7
        with:
          name: learnharness-localmain-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  # The rolling download point: every successful package job's files land on
  # one prerelease tag, `localmain-latest`. This job runs even when one
  # platform fails (matrix fail-fast is off), so the platforms that DID build
  # stay downloadable. Unsigned by design — the notes carry the warning and
  # the exact commit. Assets are clobbered, and anything from an older run
  # (previous version filenames, stale feeds) is removed.
  publish:
    name: Publish localmain prerelease
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the available installers
        uses: actions/download-artifact@v7
        with:
          pattern: learnharness-localmain-*
          path: release
          merge-multiple: true
      - name: Write release notes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Unsigned installers built from \`localmain\`.

          - Commit: \`$GITHUB_SHA\`
          - Built: $(date -u '+%Y-%m-%d %H:%M UTC')
          - Run: $RUN_URL

          > These builds are unsigned and not notarized. macOS Gatekeeper and
          > Windows SmartScreen will warn. Verify the download before running.

          One or more platform jobs may have failed; this release carries every
          installer that built successfully in this run.
          EOF
      - name: Create or update localmain-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          # Guard the upload: a run where every package job failed must not
          # create an empty "release".
          shopt -s nullglob
          files=(*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installer files were produced." >&2
            exit 1
          fi
          printf 'Publishing:\n'; printf '  %s\n' "${files[@]}"

          if gh release view localmain-latest >/dev/null 2>&1; then
            gh release edit localmain-latest \
              --prerelease --title "localmain latest (unsigned)" \
              --notes-file "$RUNNER_TEMP/notes.md"
            # Drop assets that this run did not produce (old versions, stale
            # feeds), so the release always describes the current commit.
            gh release view localmain-latest --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -z "$asset" ] && continue
                keep=0
                for file in "${files[@]}"; do
                  if [ "$file" = "$asset" ]; then keep=1; break; fi
                done
                if [ "$keep" -eq 0 ]; then
                  gh release delete-asset localmain-latest "$asset" --yes
                fi
              done
          else
            gh release create localmain-latest \
              --prerelease --title "localmain latest (unsigned)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

          gh release upload localmain-latest "${files[@]}" --clobber
